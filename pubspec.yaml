name: coderipple
description: SAHA 2559 — polis mevzuat, haklar, teşkilat ve kültür offline uygulaması. Mağaza yayın markası Coderipple.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  # Isar topluluk çatalı (isar_community): orijinal 3.1.0 bakımsız ve native .so
  # dosyaları 16 KB sayfa boyutunu desteklemediği için Android 15+ / Google Play
  # (1 Kasım 2025 sonrası) uyumsuzdu. Topluluk sürümü API olarak birebir aynıdır.
  # 16 KB + namespace desteği 3.2.0'dan beri var. 3.3.2 Dart 3.11+ ile uyumludur.
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.4
  path_drawing: ^1.0.1
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.10+1
  xml: ^6.5.0
  share_plus: ^10.1.4
  intl: ^0.20.2
  phosphoricons_flutter: ^1.0.0
  pdf: ^3.11.1
  printing: ^5.13.4
  speech_to_text: ^7.0.0
  file_picker: ^8.1.6
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  cryptography: ^2.7.0
  device_info_plus: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.10
  isar_community_generator: ^3.3.2
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
    background_color: "#1a2332"
    theme_color: "#1a2332"
  windows:
    generate: true
    icon_size: 48
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1a2332"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/mevzuat/
    - assets/mevzuat/kanunlar/
    - assets/mevzuat/yonetmelikler/
    - assets/asistan/concepts.json
    - assets/asistan/scenarios.json
    - assets/json/city_contacts.json
    - assets/json/maas_katsayilari.json
    - assets/json/polis_odeme_derece_kademe.json
    - assets/json/gorev_puanlari_2025.json
    - assets/json/martyrs.json
    - assets/map/turkey.svg
    - assets/kultur/
    - assets/images/
    - assets/images/ataturk_matem.jpg
    - assets/icon/app_icon.png

