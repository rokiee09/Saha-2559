name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pubspec.lock Flutter >=3.38 / Dart >=3.10 gerektirir (3.29.x ile uyumsuz).
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.5"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Mevcut kodda info seviyesi stil önerileri var; bunlar derlemeyi düşürmesin
      # ama gerçek uyarı/hatalar (fatal-warnings) CI'ı kırsın.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Validate mevzuat data
        run: dart run tool/validate_mevzuat.dart

      - name: Run tests
        run: flutter test --exclude-tags slow --timeout 90s
